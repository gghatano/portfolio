name: Sync works cards

# 作成物カード (/works/) の更新日・言語・star を洗い替え、差分があれば main へ commit する。
# 並び順は「ピックアップ → 最終更新の新しい順」なので、このジョブの実行間隔が
# そのまま並び順の鮮度になる。頻度を変えるときは下の cron を書き換える。
on:
  schedule:
    # 毎日 09:00 JST (= 00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-works
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Sync works
        run: node scripts/sync-works.mjs --write | tee sync-report.txt

      - name: Report
        run: |
          {
            echo '## sync-works'
            echo '```'
            cat sync-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f sync-report.txt

      - name: Commit & deploy
        run: |
          if git diff --quiet -- src/content/works; then
            echo "差分なし。commit はしない。"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content/works
          git commit -m 'works: カードの更新日・言語・star を同期'
          git push
          # GITHUB_TOKEN による push では deploy.yml (on: push) が起動しないため明示的に呼ぶ。
          gh workflow run deploy.yml --ref main
