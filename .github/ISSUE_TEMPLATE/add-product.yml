name: プロダクトを追加
description: 開発したものをトップページに常時表示するためのテンプレート
title: "[product] "
labels: ["content", "content:product"]
body:
  - type: markdown
    attributes:
      value: |
        プロダクト (product) エントリを追加します。
        Issue 作成後、ローカルで `/from-issue <#>` または `/add-product <#>` を実行してファイル生成。
        フォーマットの詳細は [`docs/templates/product.json.template`](../../docs/templates/product.json.template)。

  - type: input
    id: name
    attributes:
      label: 名称
    validations:
      required: true

  - type: textarea
    id: tagline
    attributes:
      label: 1〜2 行説明
      description: 詳細ページに表示される短い説明。トップのグリッドセルには表示されない（セルはアイコン + 名前のみ）。
    validations:
      required: true

  - type: input
    id: icon
    attributes:
      label: アイコン文字（1〜4 文字、任意）
      description: トップのグリッドセルに表示される 1 文字。漢字推奨（例「畑」「観」「型」）。省略時は名称の先頭文字。
      placeholder: 畑

  - type: textarea
    id: description_md
    attributes:
      label: 詳細説明（任意）
      description: 詳細ページの「概要」として表示される。Markdown 段落区切り（空行で段落分け）可。

  - type: input
    id: period_start
    attributes:
      label: 開始 (YYYY-MM、任意)
      placeholder: 2024-04

  - type: input
    id: period_end
    attributes:
      label: 終了 (YYYY-MM または present、任意)
      placeholder: present

  - type: input
    id: role
    attributes:
      label: 役割（任意）
      placeholder: 個人開発 / 主導 / OSS contributor / テックリード など

  - type: input
    id: tech
    attributes:
      label: 主要技術（カンマ区切り、任意）
      placeholder: TypeScript, Astro, Zod

  - type: textarea
    id: links
    attributes:
      label: 関連リンク（任意 / 1 行 1 件 / `ラベル | URL`）
      placeholder: |
        Repo | https://github.com/example/foo
        Live | https://example.com

  - type: input
    id: priority
    attributes:
      label: 表示順 (整数、任意)
      description: 小さいほど先頭。同じ priority は period_start の新しい順。
      placeholder: "1"
